<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GeoTag Camera">
  <rect width="1200" height="300" fill="#F7F6F4"/>

  <g transform="translate(72,68) scale(0.82)">
    <rect x="25" y="25" width="150" height="150" rx="50" fill="none" stroke="#16181A" stroke-width="14"/>
    <circle cx="100" cy="100" r="18.75" fill="#56CB98"/>
  </g>

  <text x="290" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#16181A">GeoTag Camera</text>
  <text x="292" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6A6F75">Free, open source, ad-free GPS camera for Android</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#4E5459">
    <rect x="292" y="222" width="98" height="36" rx="18" fill="#FFFFFF" stroke="#D8D5CF"/>
    <text x="312" y="245">No Ads</text>

    <rect x="404" y="222" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#D8D5CF"/>
    <text x="424" y="245">Open Source</text>

    <rect x="568" y="222" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#D8D5CF"/>
    <text x="588" y="245">Works Offline</text>

    <rect x="732" y="222" width="120" height="36" rx="18" fill="#FFFFFF" stroke="#D8D5CF"/>
    <text x="752" y="245">GPLv3</text>
  </g>
</svg>
