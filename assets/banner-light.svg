<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="GeoTag Camera">
  <rect width="1200" height="300" fill="#FBF8F2"/>

  <g transform="translate(70,50) scale(0.9)">
    <path fill="#2A5F8F" d="M100,6 C52,6 10,46 10,96 C10,152 100,210 100,210 C100,210 190,152 190,96 C190,46 148,6 100,6 Z"/>
    <rect fill="#FBF8F2" x="36" y="60" width="128" height="92" rx="24"/>
    <rect fill="#FBF8F2" x="84" y="44" width="32" height="18" rx="8"/>
    <circle fill="#2A5F8F" cx="100" cy="110" r="38"/>
    <circle fill="#FBF8F2" cx="100" cy="110" r="17"/>
  </g>

  <text x="290" y="150" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#1B3A4B">GeoTag Camera</text>
