    <rect x="568" y="222" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#C7C0B0"/>
    <text x="588" y="245">Works Offline</text>

    <rect x="732" y="222" width="120" height="36" rx="18" fill="#FFFFFF" stroke="#C7C0B0"/>
