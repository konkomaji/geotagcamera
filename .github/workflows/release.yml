name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      HAS_SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Don't let a release build write to the shared Gradle cache.
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Check tag matches versionName
        run: |
          version="${TAG#v}"
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          echo "Tag version: $version, versionName: $name"
          if [ "$version" != "$name" ]; then
            echo "::error::Tag $TAG does not match versionName \"$name\" in app/build.gradle.kts"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning::No CHANGELOG.md section for $version, using a link instead"
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Decode signing keystore
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleFossRelease --no-daemon --stacktrace
          apks=$(ls app/build/outputs/apk/foss/release/*.apk 2>/dev/null | grep -v unsigned || true)
          if [ -z "$apks" ]; then
            echo "::error::No signed release APK was produced. Does app/build.gradle.kts read the RELEASE_* env vars?"
            ls -la app/build/outputs/apk/foss/release/ || true
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          mkdir -p dist
          # One APK per CPU type plus a universal one (app-<abi>-release.apk).
          for apk in $apks; do
            "$apksigner" verify --print-certs "$apk"
            abi=$(basename "$apk" .apk | sed -e 's/^app-foss-//' -e 's/-release$//')
            cp "$apk" "dist/geotagcamera-${TAG}-${abi}.apk"
          done

      - name: Build debug APK (signing secrets not configured)
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::Signing secrets are not set, publishing a debug-signed APK instead"
          ./gradlew assembleFossDebug --no-daemon --stacktrace
          mkdir -p dist
          for apk in app/build/outputs/apk/foss/debug/*.apk; do
            abi=$(basename "$apk" .apk | sed -e 's/^app-foss-//' -e 's/-debug$//')
            cp "$apk" "dist/geotagcamera-${TAG}-${abi}-debug.apk"
          done
          {
            echo
            echo "> **Note:** this APK is signed with a debug key because release signing was not configured for this build. It can't be installed over a release-signed copy of the app."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Compute SHA-256
        working-directory: dist
        run: |
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
            cat "$f.sha256"
          done
          {
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat ./*.sha256
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release is a pre-release until the app has had a real-device
          # test pass; set the repo variable PRERELEASE to "false" to publish
          # a full release instead.
          prerelease="--prerelease"
          if [ "${{ vars.PRERELEASE }}" = "false" ]; then prerelease=""; fi
          # If a release for this tag was already created by hand, attach the
          # CI-built assets to it instead of failing the job.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "GeoTag Camera ${TAG#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --verify-tag $prerelease
          fi
