name: Release (Google Play)

# Separate from release.yml on purpose: the GitHub release and F-Droid ship the
# "foss" flavor (no Google services, no analytics); Google Play gets the "play"
# flavor as an Android App Bundle. Run by hand once a vX.Y.Z tag exists.
# The .aab is kept as a workflow artifact only: it is never attached to the
# GitHub release, so the public downloads stay the FOSS build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.4.2"
        required: true

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Check tag matches versionName
        run: |
          chmod +x ./gradlew
          version="${TAG#v}"
          name=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "$version" != "$name" ]; then
            echo "::error::Tag $TAG does not match versionName \"$name\""
            exit 1
          fi

      # Upload key for Google Play. Falls back to the main release key when no
      # separate PLAY_UPLOAD_* secrets are set (see docs/play-store.md).
      - name: Decode upload keystore
        env:
          KS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::No signing keystore secret"; exit 1; fi
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          # Consent-gated analytics (Play build only). Unset = analytics off.
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ]; then echo "::warning::FIREBASE_* secrets not set: this AAB has analytics switched off"; fi
          ./gradlew --no-daemon bundlePlayRelease

      - name: Rename and checksum
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "out/geotagcamera-${TAG}-play.aab"
          cp app/build/outputs/mapping/playRelease/mapping.txt "out/mapping-${TAG}-play.txt"
          (cd out && sha256sum *.aab > "geotagcamera-${TAG}-play.aab.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: geotagcamera-${{ inputs.tag }}-play
          path: out/
          retention-days: 30
