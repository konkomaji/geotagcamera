name: Deploy GitHub Pages redirect

# The website now lives at https://konkomaji.com/geotagcamera/ (built by site/build.py and
# uploaded to Hostinger by hand). GitHub Pages only serves a tiny redirect site so old links
# to https://konkomaji.github.io/geotagcamera/ keep working, with their path preserved.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site and redirect pages
        run: python3 site/build.py --no-zip

      - name: Upload redirect site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
