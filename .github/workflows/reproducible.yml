name: Reproducible build check

# F-Droid rebuilds the app from source and publishes our signed APK only if its
# own build matches ours byte for byte. This workflow builds the same commit
# the way release.yml does (Ubuntu, Temurin 17, all splits) and the way F-Droid
# does (one ABI via -Pabi, on Debian bookworm/OpenJDK 17 and trixie/OpenJDK 21),
# then compares every ABI's APK. Given a tag, it also checks the published
# release APKs with apksigcopier, the same tool F-Droid uses.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build"
        required: true
        default: main
      tag:
        description: "Release tag whose arm64-v8a APK to compare against (optional, e.g. v1.4.1)"
        required: false
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

env:
  # workflow_run: the Release workflow ran on a tag push, so head_branch is the tag.
  REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.ref }}
  TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.tag }}

jobs:
  release-style:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Build unsigned foss release (all splits, like release.yml)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossRelease --no-daemon --no-build-cache --stacktrace
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "app/build/outputs/apk/foss/release/app-foss-${abi}-release-unsigned.apk" "release-style-${abi}.apk"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-style
          path: release-style-*.apk

  fdroid-style:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86_64]
        # F-Droid's build server image moves between Debian releases; cover both.
        server:
          - { image: "debian:bookworm", jdk: "17" }
          - { image: "debian:trixie", jdk: "21" }
    container: ${{ matrix.server.image }}
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-${{ matrix.server.jdk }}-jdk-headless git wget unzip ca-certificates
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}
          # A different checkout path than the other job, like F-Droid's build server.
          path: build/com.geotagcamera.geotagginglocationonphoto
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - name: Build unsigned foss release (one ABI, like F-Droid)
        working-directory: build/com.geotagcamera.geotagginglocationonphoto
        run: |
          chmod +x ./gradlew
          ./gradlew assembleFossRelease -Pabi=${{ matrix.abi }} --no-daemon --no-build-cache --stacktrace
          cp "app/build/outputs/apk/foss/release/app-foss-${{ matrix.abi }}-release-unsigned.apk" \
            "$GITHUB_WORKSPACE/fdroid-${{ matrix.abi }}-jdk${{ matrix.server.jdk }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-${{ matrix.abi }}-jdk${{ matrix.server.jdk }}
          path: fdroid-${{ matrix.abi }}-jdk${{ matrix.server.jdk }}.apk

  compare:
    needs: [release-style, fdroid-style]
    if: always() && needs.release-style.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Compare the F-Droid-style builds with the release-style build
        run: |
          sha256sum ./*.apk
          fail=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for jdk in 17 21; do
              f="fdroid-${abi}-jdk${jdk}.apk"
              echo "== ${abi}, JDK ${jdk}"
              if [ ! -f "$f" ]; then echo "missing: $f (build failed)"; fail=1; continue; fi
              if python3 .github/scripts/apkdiff.py "release-style-${abi}.apk" "$f" && cmp "release-style-${abi}.apk" "$f"; then
                echo "Byte-identical."
              else
                fail=1
              fi
            done
          done
          exit $fail
      - name: Compare with the published release APKs
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet apksigcopier
          # apksigcopier calls apksigner, which lives in the SDK's build-tools.
          export PATH="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1):$PATH"
          fail=0
          for abi in armeabi-v7a arm64-v8a x86_64; do
            rel="geotagcamera-${TAG}-${abi}.apk"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$rel"
            for jdk in 17 21; do
              f="fdroid-${abi}-jdk${jdk}.apk"
              echo "== ${rel} vs ${f}"
              [ -f "$f" ] || { echo "missing: $f"; fail=1; continue; }
              if apksigcopier compare "$rel" --unsigned "$f"; then
                echo "Match: F-Droid can ship our signed ${abi} APK."
              else
                python3 .github/scripts/apkdiff.py "$rel" "$f" || true
                fail=1
              fi
            done
          done
          exit $fail
